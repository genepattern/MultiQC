name: "MultiQC"
module: MultiQC
description: "MultiQC is a tool to create a single interactive HTML report aggregating quality control metrics from multiple bioinformatics analyses across many samples."
params:
    input.data: "https://datasets.genepattern.org/data/test_data/MultiQC/multiqc_data.zip"
    report.title: "MultiQC GPUnit"
    report.comment: "GPUnit test for MultiQC module"
assertions:
        jobStatus: success
